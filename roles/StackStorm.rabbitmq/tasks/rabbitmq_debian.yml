---

- name: Download RabbitMQ signing key (ASCII)
  become: yes
  get_url:
    url: https://keys.openpgp.org/vks/v1/by-fingerprint/0A9AF2115F4687BD29803A206B73A36E6026DFCA
    dest: /tmp/rabbitmq.asc
    mode: '0644'
  tags: rabbitmq

- name: Convert key to GPG keyring format
  become: yes
  command: >
    gpg --dearmor -o /usr/share/keyrings/com.rabbitmq.team.gpg /tmp/rabbitmq.asc
  args:
    creates: /usr/share/keyrings/com.rabbitmq.team.gpg
  tags: rabbitmq

- name: Ensure pre-requisites are installed
  become: yes
  apt:
    name: "{{ item }}"
    state: present
  register: _task
  retries: 5
  delay: 3
  until: _task is succeeded
  tags: rabbitmq
  loop:
    - apt-transport-https
    - gnupg

- name: Add launchpad key
  become: yes
  apt_key:
    url: https://keyserver.ubuntu.com/pks/lookup?op=get&fingerprint=on&search=0xf77f1eda57ebb1cc
    id: "57ebb1cc"
    state: present
  register: _task
  retries: 5
  delay: 3
  until: _task is succeeded
  tags: rabbitmq

- name: Add RabbitMQ Erlang repositories
  become: yes
  apt_repository:
    repo: "{{ item }}"
    state: present
  loop:
    - "deb [arch=amd64 signed-by=/usr/share/keyrings/com.rabbitmq.team.gpg] https://deb1.rabbitmq.com/rabbitmq-erlang/ubuntu/{{ ansible_facts.distribution_release | lower }} {{ ansible_facts.distribution_release | lower }} main"
    - "deb [arch=amd64 signed-by=/usr/share/keyrings/com.rabbitmq.team.gpg] https://deb2.rabbitmq.com/rabbitmq-erlang/ubuntu/{{ ansible_facts.distribution_release | lower }} {{ ansible_facts.distribution_release | lower }} main"
  tags: rabbitmq

- name: Add RabbitMQ repositories
  become: yes
  apt_repository:
    repo: "{{ item }}"
    state: present
  loop:
    - "deb [arch=amd64 signed-by=/usr/share/keyrings/com.rabbitmq.team.gpg] https://deb1.rabbitmq.com/rabbitmq-server/ubuntu/{{ ansible_facts.distribution_release | lower }} {{ ansible_facts.distribution_release | lower }} main"
    - "deb [arch=amd64 signed-by=/usr/share/keyrings/com.rabbitmq.team.gpg] https://deb2.rabbitmq.com/rabbitmq-server/ubuntu/{{ ansible_facts.distribution_release | lower }} {{ ansible_facts.distribution_release | lower }} main"
  tags: rabbitmq

- name: Install latest erlang packages on {{ ansible_facts.distribution }}
  become: yes
  package:
    name: "{{ item }}"
    state: present
  register: _eltask
  retries: 5
  delay: 3
  until: _eltask is succeeded
  tags: rabbitmq
  loop:
    - erlang-base
    - erlang-asn1
    - erlang-crypto
    - erlang-eldap
    - erlang-ftp
    - erlang-inets
    - erlang-mnesia
    - erlang-os-mon
    - erlang-parsetools
    - erlang-public-key
    - erlang-runtime-tools
    - erlang-snmp
    - erlang-ssl
    - erlang-syntax-tools
    - erlang-tftp
    - erlang-tools
    - erlang-xmerl
  when: erlang_version == "present"

# Order is important when using pinned versions as have to do in order of dependencies
- name: Install pinned erlang packages on {{ ansible_facts.distribution }}
  become: yes
  package:
    name: "{{ item }}={{ erlang_version }}"
    state: present
  register: _eltask
  retries: 5
  delay: 3
  until: _eltask is succeeded
  tags: rabbitmq
  when: erlang_version != "present"
  loop:
    - erlang-base
    - erlang-asn1
    - erlang-crypto
    - erlang-public-key
    - erlang-mnesia
    - erlang-runtime-tools
    - erlang-ssl
    - erlang-eldap
    - erlang-ftp
    - erlang-tftp
    - erlang-inets
    - erlang-snmp
    - erlang-os-mon
    - erlang-parsetools
    - erlang-syntax-tools
    - erlang-tools
    - erlang-xmerl
